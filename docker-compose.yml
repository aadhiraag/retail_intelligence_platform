
services:
  postgres:
    image: postgres:16
    container_name: niq_postgres
    environment:
      POSTGRES_DB: niq_retail
      POSTGRES_USER: niq_user
      POSTGRES_PASSWORD: ${NIQ_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U niq_user -d niq_retail"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
